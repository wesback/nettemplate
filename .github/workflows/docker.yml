name: docker

# Builds, scans with Trivy and pushes every image in deploy/images.json to Docker Hub
# as <DOCKERHUB_USERNAME>/<repository name>-<image name>.
# Pull requests build and scan only; main also pushes `latest`; v*.*.* tags push semver.
# Needs the DOCKERHUB_USERNAME repository variable and the DOCKERHUB_TOKEN secret.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

jobs:
  images:
    # The template repo itself has no projects until scripts/init.sh runs.
    if: github.repository != 'wesback/nettemplate'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      # The images to build live in deploy/images.json, which the project owns, so this
      # workflow stays the same in every project and can be synced from the template.
      - id: read
        run: echo "matrix=$(jq -c . deploy/images.json)" >> "$GITHUB_OUTPUT"

  image:
    needs: images
    name: image (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.images.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}-${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: scan:local
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Pin to the release's full commit SHA (supply-chain hardening)
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Push to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
