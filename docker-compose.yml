# Local development: docker compose up --build
#   web       http://localhost:3000
#   api       http://localhost:8080   (Dapr sidecar shares its network namespace, HTTP API on :3500)
#   rabbitmq  http://localhost:15672  (management UI, user app / app)
#   postgres  localhost:5432          (user app / app, database app)
# Same infrastructure as production (deploy/compose.yml), with dev credentials and published ports.
services:
  api:
    build:
      context: .
      dockerfile: src/MyService.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DAPR_HTTP_PORT: "3500"
      DAPR_GRPC_PORT: "50001"

  api-dapr:
    image: daprio/daprd:1.18.10
    command:
      - ./daprd
      - --app-id=my-service-api
      - --app-port=8080
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --resources-path=/components
    volumes:
      - ./components/local:/components:ro
    network_mode: "service:api"
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  web:
    build:
      context: web
    ports:
      - "3000:3000"
    environment:
      API_BASE_URL: http://api:8080
    depends_on:
      - api

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rabbitmq-data:
  postgres-data:
