# Local development: docker compose up --build
#   web       http://localhost:3000
#   api       http://localhost:8080
#   postgres  localhost:5432          (user app / app, database app)
# >>> messaging
#   rabbitmq  http://localhost:15672  (management UI, user app / app)
# <<< messaging
# Same infrastructure as production (deploy/compose.yml), with dev credentials and published ports.
services:
  api:
    build:
      context: .
      dockerfile: src/MyService.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Username=app;Password=app;Database=app"
      # >>> dapr
      DAPR_HTTP_PORT: "3500"
      DAPR_GRPC_PORT: "50001"
      # <<< dapr
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The .NET runtime image has no curl; bash's /dev/tcp is enough for a liveness probe.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # >>> dapr
  api-dapr:
    image: daprio/daprd:1.18.10
    command:
      - ./daprd
      - --app-id=my-service-api
      - --app-port=8080
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --resources-path=/components
    volumes:
      - ./components/local:/components:ro
    # Shares the api's network namespace, so the API reaches Dapr on localhost:3500.
    network_mode: "service:api"
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      # >>> messaging
      rabbitmq:
        condition: service_healthy
      # <<< messaging

  # <<< dapr
  web:
    build:
      context: web
    ports:
      - "3000:3000"
    environment:
      API_BASE_URL: http://api:8080
    depends_on:
      - api

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  # >>> messaging
  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  # <<< messaging
volumes:
  postgres-data:
  # >>> messaging
  rabbitmq-data:
  # <<< messaging
