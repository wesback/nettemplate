# Reads secrets from the sidecar's environment, which deploy/compose.yml fills from the
# host's .env (chmod 600). Dapr documents this store for development; on a single host
# the environment is the secret store either way. To move to a real secret store
# (Vault, Azure Key Vault), replace only this file and keep the name.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: envsecrets
spec:
  type: secretstores.local.env
  version: v1
  metadata: []
