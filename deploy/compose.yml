# Production stack for one app on a Docker host. Self-contained: the app owns its
# database (and broker, if it uses messaging), and nothing here knows about the
# host's reverse proxy.
#
# The deploy workflow copies this file (and components/prod/ when Dapr is used) to
# /opt/apps/<repo>/ and runs:
#   docker compose --env-file .env --env-file deploy.env -f compose.yml [-f compose.host.yml] up -d --wait
#   .env              secrets, created once by hand on the host (see .env.example)
#   deploy.env        APP_NAME and IMAGE_TAG, written by the deploy workflow
#   compose.host.yml  optional, host-specific: reverse proxy labels and networks
name: ${APP_NAME:?set APP_NAME}

services:
  api:
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME}/my-service-api:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=postgres;Port=5432;Username=${POSTGRES_USER:?};Password=${POSTGRES_PASSWORD:?};Database=${POSTGRES_DB:?}
      # >>> dapr
      DAPR_HTTP_PORT: "3500"
      DAPR_GRPC_PORT: "50001"
      # <<< dapr
    depends_on:
      postgres:
        condition: service_healthy
      # >>> messaging
      rabbitmq:
        condition: service_healthy
      # <<< messaging
    healthcheck:
      # The .NET runtime image has no curl; bash's /dev/tcp is enough for a liveness probe.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # >>> dapr
  api-dapr:
    image: daprio/daprd:1.18.10
    restart: unless-stopped
    command:
      - ./daprd
      - --app-id=my-service-api
      - --app-port=8080
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --resources-path=/components
    volumes:
      - ./components:/components:ro
    # Read by the envsecrets store (components/prod/secretstore.yaml). Only the sidecar gets them.
    environment:
      POSTGRES_CONNECTION_STRING: host=postgres port=5432 user=${POSTGRES_USER:?} password=${POSTGRES_PASSWORD:?} database=${POSTGRES_DB:?} sslmode=disable
      # >>> messaging
      RABBITMQ_CONNECTION_STRING: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@rabbitmq:5672
      # <<< messaging
    network_mode: "service:api"
    depends_on:
      api:
        condition: service_started

  # <<< dapr
  web:
    image: ${DOCKERHUB_USERNAME}/my-service-web:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # >>> messaging
  rabbitmq:
    image: rabbitmq:4-alpine
    # The data directory is tied to the node name, which comes from the hostname.
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  # <<< messaging
volumes:
  postgres-data:
  # >>> messaging
  rabbitmq-data:
  # <<< messaging
