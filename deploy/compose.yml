# Production stack for one app on a Docker host. Self-contained: the app owns its
# RabbitMQ and Postgres, and nothing here knows about the host's reverse proxy.
#
# The deploy workflow copies this file and components/prod/ to /opt/apps/<repo>/ and runs:
#   docker compose --env-file .env --env-file deploy.env -f compose.yml [-f compose.host.yml] up -d --wait
#   .env              secrets, created once by hand on the host (see .env.example)
#   deploy.env        APP_NAME and IMAGE_TAG, written by the deploy workflow
#   compose.host.yml  optional, host-specific: reverse proxy labels and networks
name: ${APP_NAME:?set APP_NAME}

services:
  api:
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME}/my-service-api:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DAPR_HTTP_PORT: "3500"
      DAPR_GRPC_PORT: "50001"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api-dapr:
    image: daprio/daprd:1.17.3
    restart: unless-stopped
    command:
      - ./daprd
      - --app-id=my-service-api
      - --app-port=8080
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --resources-path=/components
    volumes:
      - ./components:/components:ro
    # Read by the envsecrets store (components/prod/secretstore.yaml). Only the sidecar gets them.
    environment:
      RABBITMQ_CONNECTION_STRING: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@rabbitmq:5672
      POSTGRES_CONNECTION_STRING: host=postgres port=5432 user=${POSTGRES_USER:?} password=${POSTGRES_PASSWORD:?} database=${POSTGRES_DB:?} sslmode=disable
    network_mode: "service:api"
    depends_on:
      api:
        condition: service_started

  web:
    image: ${DOCKERHUB_USERNAME}/my-service-web:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8080
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  rabbitmq:
    image: rabbitmq:4-alpine
    # The data directory is tied to the node name, which comes from the hostname.
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rabbitmq-data:
  postgres-data:
